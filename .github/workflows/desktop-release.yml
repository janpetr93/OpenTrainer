# Build the desktop app installers and attach them to a GitHub Release.
# Push a version tag to release, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# The tag sets the app version. Run it by hand (Actions → Desktop release →
# Run workflow) to build the installers as workflow artifacts without a release.
name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            companion/package-lock.json
            desktop/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix web
          npm ci --prefix companion
          npm ci --prefix desktop

      - name: Set app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: desktop
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Test
        run: |
          npm test
          npm run test:desktop

      - name: Build installers
        run: npm run dist:${{ matrix.target }} --prefix desktop -- --publish never
        env:
          # Unsigned builds for now (macOS gets an ad-hoc signature).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: opentrainer-${{ matrix.target }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
